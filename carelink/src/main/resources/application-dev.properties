spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/carelink_database}
spring.datasource.username=${DB_USERNAME:carelink}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
carelink.jwt.secret=${JWT_SECRET}
carelink.seed.enabled=${CARELINK_SEED_ENABLED:false}
carelink.payments.demo-enabled=true
spring.config.import=optional:file:./.local-carelink.properties
carelink.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
