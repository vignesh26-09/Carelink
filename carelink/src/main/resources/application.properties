spring.application.name=carelink
# Select an explicit profile. Production configuration is supplied entirely by
# environment variables, never source-controlled credentials.
spring.profiles.default=dev
server.port=${SERVER_PORT:1327}
carelink.mail.enabled=${CARELINK_MAIL_ENABLED:false}
carelink.mail.from=${MAIL_FROM:}
carelink.mail.api-key=${RESEND_API_KEY:}
